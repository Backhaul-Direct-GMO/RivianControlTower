<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BHD Rivian Control Tower — Inbound Load Planning + Drop-Trailer Governance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --nav-bg:#141d27; --nav-bg2:#0e151d; --nav-ink:#c3ccd6; --nav-active:#ffffff;
  --lime:#b8d431; --navy:#17263a;
  --bg:#f4f5f3; --panel:#ffffff; --line:#dcdfda; --line2:#e8eae5;
  --ink:#1c2733; --ink2:#53616f; --ink3:#8a95a0;
  --orange:#dd5c07; --orange-bg:#fdf0e5;
  --teal:#0c7268; --teal-bg:#e7f3f1;
  --amber:#a86a09; --amber-bg:#fbf3e2;
  --red:#b42222; --red-bg:#fbeaea;
  --slate:#4a6584; --slate-bg:#ecf1f6;
  --gray-bg:#eff1ee;
  --focus:#2f6fb5;
  font-size:13px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:13px;line-height:1.45;overflow:hidden}
button{font-family:inherit;font-size:inherit;cursor:pointer}
select,input{font-family:inherit;font-size:12px}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* ---------- app frame ---------- */
#app{display:grid;grid-template-columns:212px 1fr;grid-template-rows:52px 1fr;height:100vh}
#brand{grid-column:1;grid-row:1;background:var(--nav-bg2);display:flex;align-items:center;gap:9px;padding:0 14px;border-bottom:1px solid #232f3c}
.wordmark{font-weight:700;font-size:16px;letter-spacing:.04em;color:#fff}
.wordmark b{color:var(--lime)}
.brand-sub{font-size:9.5px;color:#7b8794;line-height:1.2;letter-spacing:.02em}
#topbar{grid-column:2;grid-row:1;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 16px;overflow-x:auto;white-space:nowrap}
#nav{grid-column:1;grid-row:2;background:var(--nav-bg);overflow-y:auto;padding:10px 0 18px;display:flex;flex-direction:column}
#main{grid-column:2;grid-row:2;overflow-y:auto;padding:16px 18px 60px;position:relative}

/* ---------- nav ---------- */
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 14px;color:var(--nav-ink);background:none;border:0;text-align:left;width:100%;font-size:12.5px;border-left:3px solid transparent}
.nav-item:hover{background:#1c2836;color:#fff}
.nav-item.active{background:#202e3e;color:var(--nav-active);border-left-color:var(--lime);font-weight:600}
.nav-item .glyph{width:16px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6c7986}
.nav-item.active .glyph{color:var(--lime)}
.nav-sec{padding:12px 14px 4px;font-size:10px;letter-spacing:.09em;color:#5d6a77;text-transform:uppercase}
.nav-foot{margin-top:auto;padding:12px 14px;font-size:10px;color:#5d6a77;line-height:1.5;border-top:1px solid #232f3c}

/* ---------- topbar ---------- */
.tb-item{display:flex;flex-direction:column;gap:1px}
.tb-label{font-size:9.5px;color:var(--ink3);letter-spacing:.04em;text-transform:uppercase}
.tb-value{font-size:12px;font-weight:600}
.tb-sep{width:1px;height:26px;background:var(--line);flex:none}
.badge-fixture{background:var(--navy);color:var(--lime);font-weight:700;font-size:10.5px;letter-spacing:.08em;padding:4px 9px;border-radius:2px;border:1px solid var(--lime);flex:none}
.persona-group{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;flex:none}
.persona-btn{border:0;background:var(--panel);padding:5px 10px;font-size:11.5px;color:var(--ink2);border-right:1px solid var(--line)}
.persona-btn:last-child{border-right:0}
.persona-btn.active{background:var(--navy);color:#fff;font-weight:600}
.btn{border:1px solid var(--line);background:var(--panel);padding:5px 10px;border-radius:3px;font-size:12px;color:var(--ink)}
.btn:hover{background:var(--gray-bg)}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-primary:hover{background:#22334a}
.btn-orange{background:var(--orange);color:#fff;border-color:var(--orange)}
.btn-orange:hover{background:#c25206}
.btn-sm{padding:2px 7px;font-size:11px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* ---------- generic ---------- */
h1.page{font-size:17px;font-weight:700;margin-bottom:2px}
.page-sub{color:var(--ink2);font-size:12px;margin-bottom:14px;max-width:900px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px;margin-bottom:14px}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line2)}
.panel-h h2{font-size:12.5px;font-weight:700}
.panel-h .hint{font-size:11px;color:var(--ink3)}
.panel-b{padding:10px 12px}
.grid{display:grid;gap:14px}
.cols-2{grid-template-columns:1fr 1fr}
.cols-3{grid-template-columns:1fr 1fr 1fr}
.cols-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1240px){.cols-4{grid-template-columns:1fr 1fr}.cols-3{grid-template-columns:1fr 1fr}}
@media(max-width:960px){.cols-2,.cols-3,.cols-4{grid-template-columns:1fr}}

table.data{width:100%;border-collapse:collapse;font-size:12px}
table.data th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--panel);z-index:1}
table.data td{padding:5px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
table.data tr:hover td{background:#f7f9f5}
table.data tr.rowlink{cursor:pointer}
.right{text-align:right}
.scrollx{overflow-x:auto}
.scrolly{overflow-y:auto}

.pill{display:inline-block;padding:1px 7px;border-radius:2px;font-size:10.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap;border:1px solid transparent}
.pill-teal{background:var(--teal-bg);color:var(--teal);border-color:#c5e0dc}
.pill-amber{background:var(--amber-bg);color:var(--amber);border-color:#ecd9ad}
.pill-red{background:var(--red-bg);color:var(--red);border-color:#eec6c6}
.pill-orange{background:var(--orange-bg);color:var(--orange);border-color:#f3d2b4}
.pill-slate{background:var(--slate-bg);color:var(--slate);border-color:#cfdbe7}
.pill-gray{background:var(--gray-bg);color:var(--ink2);border-color:var(--line)}
.pill-navy{background:#e8ecf2;color:var(--navy);border-color:#ccd5e2}

.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px 10px 7px;border-top:3px solid var(--line)}
.kpi .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .l{font-size:10px;color:var(--ink2);letter-spacing:.03em;line-height:1.25;margin-top:1px}
.kpi.t-teal{border-top-color:var(--teal)} .kpi.t-orange{border-top-color:var(--orange)}
.kpi.t-amber{border-top-color:var(--amber)} .kpi.t-red{border-top-color:var(--red)}
.kpi.t-slate{border-top-color:var(--slate)} .kpi.t-navy{border-top-color:var(--navy)}
.kpi.clickable{cursor:pointer} .kpi.clickable:hover{background:#f7f9f5}

.note{background:var(--gray-bg);border:1px solid var(--line);border-left:3px solid var(--slate);padding:8px 10px;font-size:11.5px;color:var(--ink2);border-radius:2px;margin:10px 0}
.note-orange{border-left-color:var(--orange)}
.note-teal{border-left-color:var(--teal)}
.rule-banner{background:#f0f4ea;border:1px solid #d6e0c4;border-radius:3px;padding:7px 11px;font-size:11.5px;color:#3c4a2e;margin-bottom:12px}
.rule-banner b{color:#2c3a1e}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tab{border:0;background:none;padding:7px 12px;font-size:12px;color:var(--ink2);border-bottom:2px solid transparent}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--ink);font-weight:600;border-bottom-color:var(--navy)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--gray-bg);border:1px solid var(--line);border-radius:12px;padding:2px 9px;font-size:11px;color:var(--ink2)}

.owner{font-size:11px;color:var(--ink2)}
.owner b{color:var(--ink);font-weight:600}
.next-action{font-size:11.5px}
.next-action b{font-weight:600}
.sla{font-family:'IBM Plex Mono',monospace;font-size:11px}
.sla.late{color:var(--red);font-weight:600}
.sla.soon{color:var(--orange);font-weight:600}

/* bars */
.bar-track{background:var(--gray-bg);border:1px solid var(--line2);border-radius:2px;height:14px;position:relative;overflow:hidden}
.bar-seg{position:absolute;top:0;bottom:0}
.bullet{position:relative;height:18px;background:var(--gray-bg);border:1px solid var(--line2);border-radius:2px}
.bullet .band-min{position:absolute;top:0;bottom:0;background:#f6dede}
.bullet .band-ok{position:absolute;top:0;bottom:0;background:#e3efe9}
.bullet .measure{position:absolute;top:4px;bottom:4px;background:var(--navy);border-radius:1px}
.bullet .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--ink2);margin-top:6px}
.legend .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* yard twin */
.yard{display:grid;gap:10px}
.yard-zone{border:1px solid var(--line);border-radius:3px;background:var(--panel)}
.yard-zone h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);padding:5px 8px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between}
.yard-slots{display:flex;flex-wrap:wrap;gap:5px;padding:8px;min-height:40px}
.tile{width:64px;height:34px;border-radius:2px;border:1px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:9.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--gray-bg);color:var(--ink);line-height:1.2;position:relative}
.tile:hover{outline:2px solid var(--navy)}
.tile .st{font-size:8.5px;color:inherit;opacity:.8}
.tile.flag::after{content:"!";position:absolute;top:-6px;right:-5px;background:var(--red);color:#fff;width:13px;height:13px;border-radius:50%;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Sans',sans-serif}
.tile.pulse{animation:pulse 1.2s ease-in-out 3}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(221,92,7,.0)}50%{box-shadow:0 0 0 5px rgba(221,92,7,.35)}}

/* drawer + modal + toast */
#overlay{position:fixed;inset:0;background:rgba(20,29,39,.35);display:none;z-index:40}
#drawer{position:fixed;top:0;right:-680px;width:660px;max-width:94vw;height:100vh;background:var(--panel);border-left:1px solid var(--line);box-shadow:-6px 0 18px rgba(0,0,0,.12);z-index:50;transition:right .18s ease;display:flex;flex-direction:column}
#drawer.open{right:0}
.drawer-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.drawer-b{flex:1;overflow-y:auto;padding:14px 16px 40px}
.kv{display:grid;grid-template-columns:170px 1fr;gap:3px 12px;font-size:12px;margin-bottom:12px}
.kv dt{color:var(--ink2)}
.kv dd{font-weight:500}
.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:14px;display:flex;flex-direction:column;gap:10px}
.tl-item{position:relative;font-size:11.5px}
.tl-item::before{content:"";position:absolute;left:-19.5px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--panel);border:2px solid var(--slate)}
.tl-item.conflict::before{border-color:var(--red);background:var(--red-bg)}
.tl-item .src{font-size:10px;color:var(--ink3);font-family:'IBM Plex Mono',monospace}
.redacted{color:var(--ink3);font-style:italic;background:var(--gray-bg);padding:0 5px;border-radius:2px;font-size:11px}
#toasts{position:fixed;bottom:44px;right:18px;z-index:70;display:flex;flex-direction:column;gap:8px;max-width:380px}
.toast{background:var(--navy);color:#fff;padding:9px 13px;border-radius:3px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.25);border-left:3px solid var(--lime);animation:tin .18s ease}
.toast.warn{border-left-color:var(--orange)}
.toast.crit{border-left-color:#ff6b6b}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#footer{position:fixed;bottom:0;left:212px;right:0;background:var(--panel);border-top:1px solid var(--line);padding:5px 18px;font-size:10.5px;color:var(--ink3);z-index:30;display:flex;justify-content:space-between;gap:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filters select,.filters input{border:1px solid var(--line);border-radius:3px;padding:4px 7px;background:var(--panel)}
.menu{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:3px;box-shadow:0 6px 16px rgba(0,0,0,.14);z-index:60;min-width:300px;display:none}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;font-size:12px;border-bottom:1px solid var(--line2)}
.menu button:hover{background:var(--gray-bg)}
.menu button .d{display:block;font-size:10.5px;color:var(--ink3)}
.gate-list{display:flex;flex-direction:column;gap:4px;font-size:11.5px}
.gate-list .ok::before{content:"✓";color:var(--teal);font-weight:700;margin-right:6px}
.gate-list .miss::before{content:"✕";color:var(--red);font-weight:700;margin-right:6px}
.stage-track{display:flex;flex-wrap:wrap;gap:4px}
.stage{border:1px solid var(--line);border-radius:2px;padding:3px 7px;font-size:10.5px;background:var(--gray-bg);color:var(--ink2)}
.stage.done{background:var(--teal-bg);color:var(--teal);border-color:#c5e0dc}
.stage.now{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.stage.blocked{background:var(--red-bg);color:var(--red);border-color:#eec6c6}
.small{font-size:11px;color:var(--ink2)}
.tag-own{font-size:10px;border:1px solid var(--line);border-radius:2px;padding:0 5px;color:var(--ink2);background:var(--gray-bg)}
@media(max-width:900px){#app{grid-template-columns:64px 1fr}#brand .wordmark span,.brand-sub{display:none}.nav-item span.txt{display:none}.nav-sec{display:none}#footer{left:64px}}
</style>
</head>
<body>
<div id="app">
  <div id="brand">
    <div>
      <div class="wordmark">B<b>H</b>D <span style="font-weight:400;font-size:12px;color:#8b97a3">Control Tower</span></div>
      <div class="brand-sub">Rivian Inbound + Drop-Trailer Governance</div>
    </div>
  </div>
  <div id="topbar"></div>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="footer">
  <span>Confidential working demonstration — not connected to live Rivian systems.</span>
  <span>All data on every screen is fictional deterministic fixture data. Proposed pilot only — no Rivian approval, volumes, or commitments are implied.</span>
</div>
<div id="overlay" onclick="closeDrawer()"></div>
<aside id="drawer" role="dialog" aria-modal="true"></aside>
<div id="toasts"></div>
<div id="demoMenu" class="menu" role="menu"></div>

<script>
"use strict";
/* =====================================================================
   BHD RIVIAN CONTROL TOWER — single-file working prototype
   All data below is FICTIONAL, DETERMINISTIC FIXTURE DATA.
   Fixture clock: Tue 2026-09-08, 14:20 CT, Shift 2.
   ===================================================================== */

const NOW = { d:"Tue Sep 8", t:"14:20", full:"2026-09-08 14:20 CT" };

/* ---------------- personas + field-level permission model ------------- */
const PERSONAS = {
  bhd:      { id:"bhd",      label:"BHD Internal",      short:"BHD" },
  rivian:   { id:"rivian",   label:"Rivian Operations", short:"Rivian" },
  supplier: { id:"supplier", label:"Supplier / Yard",   short:"Supplier", facility:"SPK" }
};

/* PermissionRule: field -> personas allowed. Everything not listed is open.
   Redaction is applied at render AND export time via fieldVal()/provName(). */
const PERMISSION_RULES = {
  carrierLegalName:   ["bhd"],
  carrierMcDot:       ["bhd"],
  carrierContact:     ["bhd"],
  driverContact:      ["bhd"],
  buyRate:            ["bhd"],
  customerCharge:     ["bhd"],   // shown to Rivian only where authorized flag set
  margin:             ["bhd"],
  tenderSequence:     ["bhd"],
  alternateCapacity:  ["bhd"],
  procurementNotes:   ["bhd"],
  internalNotes:      ["bhd"],
  commercialHold:     ["bhd"],
  providerHistory:    ["bhd"],
  financialState:     ["bhd"]
};
function can(field){ return (PERMISSION_RULES[field]||["bhd","rivian","supplier"]).includes(state.persona); }
function fieldVal(field, value, redactedText){
  return can(field) ? value : `<span class="redacted">${redactedText||"Redacted — BHD internal"}</span>`;
}

/* ---------------- facilities + yard zones ---------------------------- */
const FACILITIES = {
  NRM:{ id:"NRM", name:"Normal Main", type:"Plant", city:"Normal, IL", doors:14, gateHrs:"24/7" },
  SPK:{ id:"SPK", name:"Supplier Park", type:"Supplier / consolidation", city:"Normal, IL", doors:6, gateHrs:"05:00–23:00" },
  CON:{ id:"CON", name:"Consolidation Center", type:"Consolidation", city:"Bloomington, IL", doors:8, gateHrs:"05:00–23:00" }
};

/* ---------------- pool rules (min / target / max empties) ------------ */
const POOL_RULES = {
  NRM:{ min:6, target:8, max:12 },
  SPK:{ min:4, target:6, max:9 },
  CON:{ min:3, target:4, max:7 }
};

/* ---------------- carriers, asset partners, aliases ------------------ */
/* Legal identities are FICTIONAL. Rivian Operations + Supplier views only
   ever see the stable neutral alias. */
const CARRIERS = {
  C01:{ id:"C01", alias:"BHD Approved Provider 01", legal:"Heartland Cartage LLC", mc:"MC-948210", dot:"DOT-3312907", type:"Power-only", contact:"D. Renner · (309) 555-0132", compliance:"Active — insurance verified 08/26", shiftCapacity:{S1:3,S2:4,S3:2}, buyBasis:"Per-move schedule v2", notes:"Primary power-only. Strong T-4 confirmation discipline." },
  C02:{ id:"C02", alias:"BHD Approved Provider 02", legal:"Prairie State Express Inc.", mc:"MC-771455", dot:"DOT-2890114", type:"Power-only", contact:"K. Osei · (217) 555-0178", compliance:"Active — insurance verified 07/26", shiftCapacity:{S1:2,S2:3,S3:2}, buyBasis:"Per-move schedule v2", notes:"Backup power-only. One open substitution exception (EX-05)." },
  C03:{ id:"C03", alias:"BHD Approved Provider 03", legal:"MidYard Hostling Services", mc:"MC-655902", dot:"DOT-2144773", type:"Hostler / yard", contact:"J. Alcaraz · (309) 555-0166", compliance:"Active — site badge audit 08/26", shiftCapacity:{S1:2,S2:2,S3:1}, buyBasis:"Hourly yard schedule", notes:"On-site hostler crew, Normal Main." }
};
const ASSET_PARTNERS = {
  AP1:{ id:"AP1", alias:"Asset Partner A", legal:"Vantage Trailer Leasing", commitment:"18 × 53' dry vans, interchange in force", expiry:"Rolling 90-day", contact:"vantage-ops (BHD internal)", },
  AP2:{ id:"AP2", alias:"Asset Partner B", legal:"Corridor Asset Group",   commitment:"8 × 53' dry vans, interchange in force",  expiry:"60-day notice", contact:"corridor-desk (BHD internal)" }
};
function provName(cid){
  const c = CARRIERS[cid]; if(!c) return "—";
  return state.persona==="bhd" ? `${c.legal} <span class="tag-own">${c.alias.slice(-2)}</span>` : c.alias;
}
function partnerName(pid){
  const p = ASSET_PARTNERS[pid]; if(!p) return "—";
  return state.persona==="bhd" ? p.legal : p.alias;
}

/* ---------------- owners ---------------------------------------------- */
const OWNERS = {
  bhdPlanner:"M. Keller (BHD Planning)", bhdDispatch:"R. Soto (BHD Shuttle Desk)",
  bhdOps:"T. Nwosu (BHD Ops Lead)", bhdAudit:"L. Pham (BHD Billing/Audit)",
  yardNRM:"Yard Lead — Normal Main", yardSPK:"Yard Lead — Supplier Park",
  rivianOps:"Rivian Inbound Ops (customer)", carrierC01:"Provider desk 01", carrierC02:"Provider desk 02"
};

/* ---------------- trailer registry (28 controlled trailers) ----------- */
/* ownClass: AP=asset-partner-provided, LS=BHD-controlled leased,
   SB=approved substitute/surge, YD=existing yard/hostler asset.
   cargo: Empty|Partial|Loaded|Unknown
   op: operating state; side: side-states array. hb = minutes since heartbeat. */
function T(id,ext,own,partner,loc,zone,cargo,op,custody,ship,hb,dwell,extra){
  return Object.assign({
    id, ext, vin:"1BHD53"+id.slice(-3)+"FIXV", ownClass:own, partner, loc, zone,
    cargo, op, custody, ship, sensor:{ id:"SN-"+id.slice(-3), hb, status: hb>30?"Stale":"OK" },
    inspection:"Passed 08/26", maint:"Clear", seal:ship?("SL-7"+id.slice(-3)):"—", door:"Closed",
    condition:"Serviceable", dwell, side:[], nextAction:"—", owner:OWNERS.bhdOps,
    authorizedPools:["NRM","SPK","CON"], nextPM:"2026-10-04", damage:"None on file"

function poolStats(fid){
  const ts = TRAILERS.filter(t=>t.loc===fid);

  const partial = ts.filter(t=>t.cargo==="Partial").length;
  const maint = ts.filter(t=>t.side.includes("Maintenance Hold")||t.side.includes("Quarantine")).length;
  const unk = ts.filter(t=>t.cargo==="Unknown").length;
  const offline = ts.filter(t=>t.sensor.status==="Stale").length;
  return { ts, empty, loaded, partial, maint, unk, offline, total:ts.length };
}

function poolBullet(f){
  const p=poolStats(f), r=POOL_RULES[f], scale=Math.max(r.max+3,10);

  return `<div style="margin-bottom:10px;cursor:pointer" onclick="go('pools')">

function planScenario(){
  const s=state.scenario;
  const req = Math.max(8, Math.round(14*(1+s.vol/100)*(s.cycle/12.5)*(1+(s.emptyDwell-5.4)/40+(s.loadedDwell-7.8)/40)));
  const eff = Math.round(25 * (s.uptime/96) * (1+ (s.spare-12)/200));
  const shortHrs = Math.max(0, (req-eff)*6);
  const uncov = Math.max(0, req-eff);
  const emerg = uncov>0? Math.ceil(uncov/2):0;
  const imb = s.vol>10||s.emptyDwell>7?"Elevated":"Managed";
  const risk = uncov>1?"High":uncov===1?"Watch":"Low";
  const excess = Math.max(0, eff-req-2);
  const fld=(k,lab,step,unit)=>`<label class="small" style="display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px">${lab}
    <input type="number" step="${step}" value="${s[k]}" style="width:76px" onchange="state.scenario.${k}=parseFloat(this.value)||0;render()"> <span style="width:34px">${unit}</span></label>`;
  return `<div class="grid cols-2">

    ${fld("vol","Volume change",5,"%")}${fld("loadMin","Average loading time",5,"min")}${fld("unloadMin","Average unloading time",5,"min")}
    ${fld("emptyDwell","Empty dwell",0.5,"h")}${fld("loadedDwell","Loaded dwell",0.5,"h")}${fld("cycle","Trailer cycle time",0.5,"h")}
    ${fld("spare","Spare ratio",1,"%")}${fld("power","Power units per shift",1,"")}${fld("doors","Yard door capacity",1,"")}

    <button class="btn btn-primary btn-sm" onclick="render()">Recalculate</button> <button class="btn btn-sm" onclick="state.scenario={vol:0,loadMin:75,unloadMin:60,emptyDwell:5.4,loadedDwell:7.8,cycle:12.5,spare:12,power:7,doors:14,appts:18,uptime:96};render()">Reset</button>
  </div></div>
  <div class="panel"><div class="panel-h"><h2>Scenario effect (deterministic fixture model)</h2></div><div class="panel-b">
    <dl class="kv">
      <dt>Required trailers (peak day)</dt><dd class="num">${req}</dd>
      <dt>Effective fleet</dt><dd class="num">${eff}</dd>
      <dt>Expected shortage hours / wk</dt><dd class="num" style="color:${shortHrs?'var(--orange)':'var(--teal)'}">${shortHrs}</dd>
      <dt>Uncovered loads (peak day)</dt><dd class="num" style="color:${uncov?'var(--orange)':'var(--teal)'}">${uncov}</dd>
      <dt>Emergency moves expected</dt><dd class="num">${emerg}</dd>
      <dt>Pool imbalance</dt><dd>${imb}</dd>
      <dt>Production risk</dt><dd style="color:${risk==='High'?'var(--red)':risk==='Watch'?'var(--amber)':'var(--teal)'}">${risk}</dd>
      <dt>Estimated excess capacity</dt><dd class="num">${excess} trailers</dd>
      <dt>Commercial effect</dt><dd>Pending commercial input</dd>
    </dl>
    <div class="small">Model: required = base 14 × volume × cycle-time factor × dwell factor; effective = fleet × uptime × spare adjustment. Assumption-driven — no dollars are invented.</div>
  </div></div></div>`;
}

function pgYard(){
  const fac = state.persona==="supplier"?"SPK":(state.yardFac||"NRM");

  const modes=[["cargo","Cargo state"],["op","Operating state"],["dwell","Dwell risk"],["sensor","Sensor health"],["pri","Production priority"],["custody","Custody status"]];
  const ts=TRAILERS.filter(t=>t.loc===fac);
  const colorOf=(t)=>{
    if(state.yardMode==="cargo") return {Empty:"var(--teal-bg)",Partial:"var(--amber-bg)",Loaded:"var(--slate-bg)",Unknown:"var(--red-bg)"}[t.cargo];
    if(state.yardMode==="op") return t.op.includes("En Route")?"var(--slate-bg)":t.op==="Available Empty"?"var(--teal-bg)":t.op==="Unknown"?"var(--red-bg)":"var(--gray-bg)";
    if(state.yardMode==="dwell") return t.dwell>24?"var(--red-bg)":t.dwell>12?"var(--amber-bg)":"var(--teal-bg)";
    if(state.yardMode==="sensor") return t.sensor.status==="Stale"?"var(--amber-bg)":"var(--teal-bg)";
    if(state.yardMode==="pri") return (t.ship&&load(t.ship)&&["Critical","High"].includes(load(t.ship).pri))?"var(--orange-bg)":"var(--gray-bg)";
    return t.custody.startsWith("BHD")||t.custody.startsWith("Plant")||t.custody.startsWith("Supplier")?"var(--teal-bg)":"var(--amber-bg)";
  };
  const flagged=(t)=> state.yardCheck && (t.side.length>0 || t.sensor.status==="Stale" || t.cargo==="Unknown" || (!t.nextAction||t.nextAction==="—"));
  const checks=[
    ["Unknown assets", ts.filter(t=>t.cargo==="Unknown").map(t=>t.id)],
    ["Conflicting asset states", ts.filter(t=>t.side.includes("Exception Review")).map(t=>t.id)],
    ["Stale sensors (> 30 min)", ts.filter(t=>t.sensor.status==="Stale").map(t=>t.id)],
    ["Missing slot / zone confirmation", ts.filter(t=>t.zone==="Overflow").map(t=>t.id)],
    ["Unauthorized trailers", state.flags.demo5rej?[]:["COR-9911 (reported by provider — not in registry)"]],
    ["Trailers at the wrong door", []],
    ["Trailers without a next action", ts.filter(t=>!t.nextAction||t.nextAction==="—").map(t=>t.id)]
  ];
  return `
  <h1 class="page">Yard Twin</h1>
  <p class="page-sub">Abstract operational digital twin. Click any trailer tile for its detail drawer and source-of-truth timeline.</p>
  <div class="filters">
    ${state.persona!=="supplier"?`<select onchange="state.yardFac=this.value;render()"><option value="NRM" ${fac==="NRM"?"selected":""}>Normal Main</option><option value="SPK" ${fac==="SPK"?"selected":""}>Supplier Park</option></select>`:`<span class="chip">Supplier Park (your location)</span>`}
    <select onchange="state.yardMode=this.value;render()">${modes.map(([v,l])=>`<option value="${v}" ${state.yardMode===v?"selected":""}>Color: ${l}</option>`).join("")}</select>
    <button class="btn btn-sm ${state.yardCheck?'btn-orange':''}" onclick="state.yardCheck=!state.yardCheck;render()">${state.yardCheck?"Yard Check mode ON":"Yard Check mode"}</button>
  </div>
  <div class="grid" style="grid-template-columns:2fr 1fr">
    <div class="yard">
      ${zones.map(z=>{
        const zt=ts.filter(t=>t.zone===z);
        return `<div class="yard-zone"><h4><span>${z}</span><span class="num">${zt.length}</span></h4>
        <div class="yard-slots">${zt.map(t=>`<button class="tile ${flagged(t)?'flag':''} ${t._pulse?'pulse':''}" style="background:${colorOf(t)}" onclick="openTrailer('${t.id}')" title="${t.id} · ${t.cargo} · ${t.op}">
          <span>${t.id.slice(-5)}</span><span class="st">${t.cargo.slice(0,4)}·${t.dwell.toFixed(0)}h</span></button>`).join("")||'<span class="small" style="padding:4px">—</span>'}</div></div>`;
      }).join("")}
      <div class="note">Zone position combines geofence, gate, yard, carrier, and sensor events. Exact parking-slot accuracy requires yard confirmation or local positioning.</div>
    </div>
    <div>
      <div class="panel"><div class="panel-h"><h2>Yard Check findings — ${FACILITIES[fac].name}</h2></div>
      <div class="panel-b">${checks.map(([lab,items])=>`<div style="margin-bottom:7px"><b class="small">${lab}</b><div class="small">${items.length?items.join(", "):"<span style='color:var(--teal)'>None</span>"}</div></div>`).join("")}
      <button class="btn btn-sm" onclick="toast('Yard check task created — owner: ${fac==="NRM"?"Yard Lead Normal Main":"Yard Lead Supplier Park"}, due 60 min. Audit entry recorded.');logAudit('Requested yard check ${fac}','Yard Check mode findings','—','Task open')">Request physical yard check</button></div></div>
      <div class="panel"><div class="panel-h"><h2>Legend — ${modes.find(m=>m[0]===state.yardMode)[1]}</h2></div>
      <div class="panel-b legend" style="flex-direction:column;align-items:flex-start;gap:5px">
        ${state.yardMode==="cargo"?`<span><span class="sw" style="background:var(--teal-bg);border:1px solid var(--teal)"></span>Empty</span><span><span class="sw" style="background:var(--amber-bg);border:1px solid var(--amber)"></span>Partial</span><span><span class="sw" style="background:var(--slate-bg);border:1px solid var(--slate)"></span>Loaded</span><span><span class="sw" style="background:var(--red-bg);border:1px solid var(--red)"></span>Unknown</span>`:
        state.yardMode==="dwell"?`<span><span class="sw" style="background:var(--teal-bg)"></span>&lt; 12 h</span><span><span class="sw" style="background:var(--amber-bg)"></span>12–24 h</span><span><span class="sw" style="background:var(--red-bg)"></span>&gt; 24 h</span>`:
        state.yardMode==="sensor"?`<span><span class="sw" style="background:var(--teal-bg)"></span>Heartbeat OK</span><span><span class="sw" style="background:var(--amber-bg)"></span>Stale &gt; 30 min</span>`:
        `<span class="small">Warm tones flag attention; cool tones are verified/controlled states.</span>`}
        <span class="small" style="margin-top:4px">Red corner badge = Yard Check flag.</span>
      </div></div>
    </div>
  </div>`;
}

function mvAct(id,to){
  const m=move(id);
  if(id==="SM-04"&&to==="Dispatched"){
    m.status="Dispatched"; m.next="In motion CON → SPK, ETA 60 min";
    const t=trailer("BHD-53006"); t.op="En Route Empty"; t.custody=provName!==null?"Provider custody — move SM-04":"Provider custody"; t.nextAction="Deliver empty to Supplier Park";
    const e=exc("EX-02"); e.status="Resolved"; e.next="Resolved — reposition dispatched; verify arrival"; 
    logAudit("Dispatched SM-04","Restore SPK pool minimum","Ready/Assigned","Dispatched");
    state.lastEvent="14:26 — dispatch SM-04 (empty reposition CON → SPK)";
    toast("SM-04 dispatched. SPK forecast +4 h restores minimum. EX-02 marked resolved pending arrival verification.");
  } else if(to==="Held"){ m.status="Held"; m.next="Held by dispatcher — reason logged"; logAudit(`Held ${id}`,"Dispatcher hold","—","Held"); toast(`${id} held. Reason code required and logged.`,"warn"); }
  else { m.status=to; logAudit(`${id} → ${to}`,"Shuttle Desk action","—",to); toast(`${id} moved to ${to}. Audit entry recorded.`); }
  render();
}

function openException(id){
  const e=exc(id);
  openDrawer(`<div class="drawer-h"><div><b class="mono">${e.id}</b> — ${e.cat} ${sevPill(e.sev)} ${statusPill(e.status)}<div class="small">Age ${e.age} · Owner: <b>${e.owner}</b> · SLA ${slaTxt(e.sla)}</div></div><button class="btn btn-sm" onclick="closeDrawer()">Close</button></div>
  <div class="drawer-b">
    <dl class="kv">
      <dt>Production impact</dt><dd>${esc_(e.impact)}</dd>
      <dt>Subject</dt><dd class="mono">${e.subject}</dd>
      <dt>Customer-visible summary</dt><dd>${esc_(e.custSummary)}</dd>
      <dt>BHD internal detail</dt><dd>${fieldVal("internalNotes",esc_(e.intDetail))}</dd>
      <dt>Escalation path</dt><dd>${e.esc}</dd>
      <dt>Evidence</dt><dd>${e.evidence.map(v=>`<span class="chip">${v}</span>`).join(" ")}</dd>
      <dt>Next action</dt><dd>${esc_(e.next)}</dd>
    </dl>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
      ${["Acknowledge","Assign","Escalate","Create recovery move","Request yard check","Hold trailer","Place commercial hold","Resolve"].map(a=>{
        if(a==="Place commercial hold"&&!can("commercialHold")) return "";
        if(a==="Resolve") return `<button class="btn btn-primary btn-sm" onclick="resolveExc('${e.id}')">Resolve</button>`;
        return `<button class="btn btn-sm" onclick="toast('${a} recorded on ${e.id}. Audit entry written.');logAudit('${a} — ${e.id}','Exception Center action','Open','Open')">${a}</button>`;
      }).join("")}
    </div>
    ${e.id==="EX-05"?`<div class="note note-orange"><b>Substitution decision:</b> reported unit COR-9911 is not in the registry and has no interchange evidence.
      <div style="margin-top:6px"><button class="btn btn-primary btn-sm" onclick="demo5decide(true)">Approve substitution (with audit entry)</button>
      <button class="btn btn-sm" onclick="demo5decide(false)">Reject + re-tender correct unit</button></div></div>`:""}
    <b class="small">Audit trail</b>
    <div class="timeline" style="margin-top:8px">
      <div class="tl-item"><b>Opened</b> by rule engine — ${e.cat}<div class="src">rule-engine · logged with before/after state</div></div>
      <div class="tl-item"><b>Owner assigned</b> — ${e.owner}<div class="src">BHD Ops routing · SLA started</div></div>
      ${e.status==="Resolved"?`<div class="tl-item"><b>Resolved</b> — ${esc_(e.next)}<div class="src">operator action · evidence attached</div></div>`:""}
    </div>
  </div>`);
}
function resolveExc(id){
  const e=exc(id); e.status="Resolved"; e.next="Resolved — evidence attached";
  logAudit(`Resolved ${id}`,"Operator resolution with evidence","Open","Resolved");
  toast(`${id} resolved. Resolution reason + evidence recorded.`); closeDrawer(); render();
}

function demo5decide(approve){
  const e=exc("EX-05"), l=load("L-1017"), t=trailer("BHD-53026");
  if(e.status!=="Open"){ toast("EX-05 already decided.","warn"); return; }
  if(approve){
    e.status="Resolved"; e.next="Substitution APPROVED with audit entry — interchange evidence required at pickup";
    l.status="Trailer Assigned"; l.trailerId="COR-9911*"; l.next="Collect interchange evidence for substituted unit before departure"; l.exceptions=[];
    t.ship=null; t.op="Available Empty"; t.side=[]; t.nextAction="Released from L-1017 after approved substitution";
    logAudit("Approved substitution on L-1017","Ops-lead decision — COR-9911 accepted with mandatory interchange evidence","Dispatch blocked","Trailer Assigned (substitute)");
    toast("Substitution APPROVED with audit entry. Interchange evidence required before departure; partner notified.");
  } else {
    state.flags.demo5rej=true;
    e.status="Resolved"; e.next="Substitution REJECTED — re-tendered with correct unit BHD-53026";
    l.status="Ready to Tender"; l.next="Re-tender with BHD-53026; provider corrective action logged"; l.exceptions=[];
    t.nextAction="Hold for corrected L-1017 dispatch";
    logAudit("Rejected substitution on L-1017","Non-registry unit, no interchange evidence","Dispatch blocked","Re-tender with correct unit");
    toast("Substitution REJECTED. L-1017 back to Ready to Tender with the correct unit; provider corrective action logged.");
  }
  closeDrawer(); render();
}
